<section id="kontak" class="py-20 md:py-24 bg-white overflow-hidden relative">

            <div data-aos="fade-right">

                <form class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="flex flex-col space-y-2">
                            <label for="name" class="font-body font-bold text-sm text-gray-700">Nama Lengkap</label>
                            <input type="text" id="name" placeholder="Masukkan nama Anda"
                                class="px-5 py-3 md:px-6 md:py-4 bg-gray-50 border border-gray-100 rounded-xl md:rounded-2xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-body text-sm">
                        </div>
                        <div class="flex flex-col space-y-2">
                            <label for="email" class="font-body font-bold text-sm text-gray-700">Alamat Email</label>
                            <input type="email" id="email" placeholder="email@contoh.com"
                                class="px-5 py-3 md:px-6 md:py-4 bg-gray-50 border border-gray-100 rounded-xl md:rounded-2xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-body text-sm">

                    </div>
                    <div class="flex flex-col space-y-2">
                        <label for="subject" class="font-body font-bold text-sm text-gray-700">Subjek</label>
                        <input type="text" id="subject" placeholder="Apa yang ingin Anda bicarakan?"
                            class="px-6 py-4 bg-gray-50 border border-gray-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-body text-sm">
                    </div>
                    <div class="flex flex-col space-y-2">
                        <label for="message" class="font-body font-bold text-sm text-gray-700">Pesan</label>
                        <textarea id="message" rows="5" placeholder="Tuliskan pesan Anda di sini..."
                            class="px-6 py-4 bg-gray-50 border border-gray-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-body text-sm"></textarea>
                    </div>
                    <button type="submit"
                        class="w-full py-4 bg-primary hover:bg-darkGreen text-white font-heading font-bold rounded-xl md:rounded-2xl shadow-xl shadow-primary/20 transition-all duration-300 transform hover:scale-[1.02]">Kirim
                        Sekarang</button>
                </form>
            </div>

                        <div>
                            <h5 class="font-heading font-bold text-blackSecondary">Alamat</h5>
                            <p class="text-sm text-gray-500 font-body">Jl. KH. Agus Salim No.183, Rejomulyo, Kec. Kota,
                                Kota Kediri, Jawa Timur</p>
                        </div>
                    </div>
                    <div class="flex items-start space-x-4">

                                </path>
                            </svg>
                        </div>
                        <div>
                            <h5 class="font-heading font-bold text-blackSecondary">Telepon</h5>
                            <p class="text-sm text-gray-500 font-body">+62 812-3456-7890</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
